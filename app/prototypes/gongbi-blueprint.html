function toast(msg, action){
  const el = document.createElement('div'); el.className = 'toast';
  el.innerHTML = `<span class="seal">记</span><span>${msg}</span>${action ? `<button>${action.label}</button>` : ''}`;
  $('#toasts').append(el);
  if (action) el.querySelector('button').onclick = () => { action.fn(); el.remove(); };
  setTimeout(() => el.classList.add('out'), 3800); setTimeout(() => el.remove(), 4200);
}
let popEl = null;
function closePop(){ if (popEl){ popEl.remove(); popEl = null; } $('#tour')?.classList.remove('shy'); }
function openPop(html, anchor, { place = 'bottom', width } = {}){
  const r = anchor && anchor.getBoundingClientRect ? anchor.getBoundingClientRect() : (anchor || {left:innerWidth/2-150, right:innerWidth/2+150, top:innerHeight/3, bottom:innerHeight/3});
  closePop();
  const p = document.createElement('div'); p.className = 'pop';
  if (width) p.style.width = width + 'px';
  p.innerHTML = html; document.body.append(p);
  const pr = p.getBoundingClientRect(); let x, y;
  if (place === 'right'){ x = r.right + 10; y = r.top - 6; }
  else if (place === 'left'){ const d = anchor?.closest?.('.drawer'); x = (d ? d.getBoundingClientRect().left : r.left) - pr.width - 10; y = r.top - 6; }
  else if (place === 'top'){ x = r.left; y = r.top - pr.height - 10; }
  else { x = r.left; y = r.bottom + 8; }
  x = Math.min(Math.max(12, x), innerWidth - pr.width - 12);
  y = Math.min(Math.max(12, y), innerHeight - pr.height - 12);
  p.style.left = x + 'px'; p.style.top = y + 'px';
  popEl = p; requestAnimationFrame(() => p.classList.add('on'));
  $('#tour')?.classList.add('shy');
  const f = p.querySelector('input,textarea'); if (f) setTimeout(() => f.focus(), 30);
  return p;
}
document.addEventListener('pointerdown', e => {
  if (popEl && !popEl.contains(e.target) && !e.target.closest('[data-keep-pop]')) closePop();
}, true);
function showTip(html, anchor){
  const t = $('#tip'); t.innerHTML = html; t.classList.add('on');
  const r = anchor.getBoundingClientRect(), tr = t.getBoundingClientRect();
  let x = r.left, y = r.bottom + 8; if (y + tr.height > innerHeight - 10) y = r.top - tr.height - 8;
  t.style.left = Math.min(x, innerWidth - tr.width - 12) + 'px'; t.style.top = y + 'px';
}
function hideTip(){ $('#tip').classList.remove('on'); }
function typeInto(el, text, done){
  let i = 0; el.textContent = '';
  const step = () => { i += Math.max(1, Math.round(text.length / 60)); el.textContent = text.slice(0, i); if (i < text.length) setTimeout(step, 16); else done && done(); };
  step();
}

      const n = add(B.tool, p.x, p.y); setTool('select'); setTimeout(() => edit(n.id), 0); return;
    } else if (B.tool === 'frame') drag = {mode:'frame', sx:p.x, sy:p.y};
    else if (B.tool === 'pen'){ drag = {mode:'pen', pts:[[p.x, p.y]]}; ghost.classList.add('pen'); }
    if (drag){ window.addEventListener('pointermove', onMove); window.addEventListener('pointerup', onUp, {once:true}); }
  });
  function onMove(e){
    if (!drag) return;
    const p = toW(e.clientX, e.clientY);
    if (drag.mode === 'pan'){ V.x = drag.vx + e.clientX - drag.sx; V.y = drag.vy + e.clientY - drag.sy; applyView(); }
    else if (drag.mode === 'move'){
      const n = drag.n; n.x = p.x - drag.ox; n.y = p.y - drag.oy; drag.moved = true; place(n);
      drag.kids.forEach(k => { k.m.x = n.x + k.dx; k.m.y = n.y + k.dy; place(k.m); });
      drawLinks();
    }
    else if (drag.mode === 'resize'){ drag.n.w = Math.max(140, drag.w + p.x - drag.sx); drag.n.h = Math.max(90, drag.h + p.y - drag.sy); place(drag.n); }
    else if (drag.mode === 'link'){
      ghost.setAttribute('d', `M${drag.n.x},${drag.n.y} L${p.x},${p.y}`);
      root.querySelectorAll('.bd-n.hot').forEach(x => x.classList.remove('hot'));
      const t = document.elementFromPoint(e.clientX, e.clientY)?.closest('.bd-n');
      if (t && t.dataset.id !== drag.n.id) t.classList.add('hot');
    }
    else if (drag.mode === 'frame'){
      drag.p = p;
      const x = Math.min(p.x, drag.sx), y = Math.min(p.y, drag.sy), w = Math.abs(p.x - drag.sx), h = Math.abs(p.y - drag.sy);
      ghost.setAttribute('d', `M${x},${y} h${w} v${h} h${-w} Z`);
    }
    else if (drag.mode === 'pen'){
      const l = drag.pts[drag.pts.length - 1];
      if (Math.hypot(p.x - l[0], p.y - l[1]) > 2.5) drag.pts.push([p.x, p.y]);
      ghost.setAttribute('d', 'M' + drag.pts.map(c => c.map(v => v.toFixed(1)).join(',')).join(' L'));
    }
  }
  function onUp(e){
    window.removeEventListener('pointermove', onMove);
    const d = drag; drag = null;
    vp.classList.remove('panning'); ghost.setAttribute('d', ''); ghost.classList.remove('pen');
    if (!d) return;
    if (d.mode === 'link'){
      root.querySelectorAll('.bd-n.hot').forEach(x => x.classList.remove('hot'));
      const t = document.elementFromPoint(e.clientX, e.clientY)?.closest('.bd-n');
      if (t && t.dataset.id !== d.n.id){
        const ed = {id:uid('e'), from:d.n.id, to:t.dataset.id, label:''}; data.edges.push(ed);
        drawLinks(); select({kind:'edge', id:ed.id});
        const lab = root.querySelector(`[data-eid="${ed.id}"]`); if (lab) edgePop(ed.id, lab);
      } else if (!t && vp.contains(document.elementFromPoint(e.clientX, e.clientY))){
        const p = toW(e.clientX, e.clientY);
        const kind = d.n.type === 'note' ? 'note' : d.n.type;
        const n = add(kind, p.x, p.y);
        data.edges.push({id:uid('e'), from:d.n.id, to:n.id, label:''}); drawLinks();
        setTimeout(() => edit(n.id), 0);
      }
    }
    else if (d.mode === 'frame' && d.p){
      const x = Math.min(d.p.x, d.sx), y = Math.min(d.p.y, d.sy), w = Math.abs(d.p.x - d.sx), h = Math.abs(d.p.y - d.sy);
      if (w > 60 && h > 40){
        const f = {id:uid('f'), type:'frame', x, y, w, h, text:'', tone:TONES[data.nodes.filter(n => n.type === 'frame').length % TONES.length]};
        data.nodes.unshift(f); setTool('select'); render(); select({kind:'node', id:f.id}); setTimeout(() => edit(f.id), 0);
      }
    }
    else if (d.mode === 'pen' && d.pts.length > 2){
      data.strokes.push({id:uid('k'), d:'M' + d.pts.map(c => c.map(v => v.toFixed(1)).join(',')).join(' L'), tone:'zhu'}); drawLinks();
    }
    else if (d.mode === 'move' && d.moved && d.n.type !== 'frame' && opt.onMoved) opt.onMoved(d.n, frameAt(d.n));
  }
  vp.addEventListener('dblclick', e => {
    const nEl = e.target.closest('.bd-n, .bd-ft');
    if (nEl){ edit(nEl.dataset.id); return; }
    if (e.target.closest('.bd-el')) return;
    const p = toW(e.clientX, e.clientY);
    const n = add(opt.defaultKind || 'note', p.x, p.y); setTimeout(() => edit(n.id), 0);
  });
  vp.addEventListener('wheel', e => {
    e.preventDefault();
    const r = vp.getBoundingClientRect();
    zoomAt(V.k * (e.deltaY < 0 ? 1.1 : 1 / 1.1), e.clientX - r.left, e.clientY - r.top);
  }, {passive:false});
  q('.bd-tools').addEventListener('click', e => { const t = e.target.closest('[data-tool]'); if (t) setTool(t.dataset.tool); });
  q('.bd-zoom').addEventListener('click', e => {
    const z = e.target.closest('[data-z]'); if (!z) return;
    const r = vp.getBoundingClientRect();
    if (z.dataset.z === 'fit') fit(); else zoomAt(V.k * (z.dataset.z === '+' ? 1.2 : 1 / 1.2), r.width / 2, r.height / 2);
  });
  B.del = () => {
    if (!B.sel) return;
    const {kind, id} = B.sel;
    if (kind === 'node'){ const n = N(id); removeNode(id); opt.onRemoved && opt.onRemoved(n); }
    else if (kind === 'edge') data.edges = data.edges.filter(e => e.id !== id);
    else data.strokes = data.strokes.filter(s => s.id !== id);
    B.sel = null; closePop(); render();
  };
  Object.assign(B, {render, fit, setTool, select, edit, add, drawLinks});
  activeBoard = B;
  render();
  if (!V.ready){
    const ro = new ResizeObserver(() => { if (vp.clientWidth < 40 || vp.clientHeight < 40) return; ro.disconnect(); V.ready = true; render(); fit(); });
    ro.observe(vp);
  }
  return B;
}

function studyCastBoard(st){
  const names = studyNames(st), others = names.slice(1);
  const LAYOUT = st === S.studies.hu ? {林衍:[0,0], 李绣娘:[0,-220], 刘夫人:[340,-20], 丫鬟:[380,200], 神秘高手:[170,250], 梅花庄二小姐:[330,-230], 赵天彪:[-330,-120], 赵太爷:[-430,150], 黑风寨寨主:[-130,270]} : {};
  const nodes = names.map((nm, i) => {
    const a = -Math.PI / 2 + (i - 1) / Math.max(1, others.length) * Math.PI * 2;
    const [x, y] = LAYOUT[nm] || (i ? [Math.round(Math.cos(a) * 330), Math.round(Math.sin(a) * 230)] : [0, 0]);
    return {id:'p' + i, type:'person', text:nm, sub:st.castSub[nm] || '', tone:i ? TONES[i % TONES.length] : 'zhu', x, y};
  });
  const id = nm => nodes.find(n => n.text === nm)?.id;
  const E = (a, b, label, secret) => id(a) && id(b) ? {id:uid('e'), from:id(a), to:id(b), label, secret} : null;
  const edges = [E('林衍','李绣娘','护卫'), E('林衍','刘夫人','护卫'), E('赵太爷','赵天彪','义父子'), E('丫鬟','刘夫人','出卖', true), E('赵太爷','黑风寨寨主','收买', true), E('赵天彪','林衍','敌对'), E('神秘高手','刘夫人','盟友')].filter(Boolean);

}
function studyEventBoard(st){
  let main, side = [], links = [], groups = [];
  if (st === S.studies.hu){
    main = [['护送李绣娘','第一章'],['察觉不对，折返救人','第一–二章'],['威慑地头蛇，名声外传','第二章'],['刘夫人上门求护送','第三章'],['丫鬟出卖，入局','第四章'],['砍瓜切菜，英雄救美','第五章'],['偶遇神秘高手','第八章'],['剿灭黑风寨','第九–十章']];
    side = [['赵天彪回禀赵太爷','第七章', 5],['密谋：联络黑风寨','第七章', 6],['黑风寨谈判，剑客杀到','第十章', 7]];
    links = [[0, 1, '但是'], [1, 2, '于是'], [2, 3, '于是'], [3, 4, '但是'], [4, 5, ''], [5, 6, '于是'], [6, 7, '']];
    groups = [[0, 2, st.bridges[0]], [3, 5, st.bridges[1]]];
  } else {
    main = st.chapters.map(c => [(c.sum.split(/[；;。]/)[0] || `第${cn(c.n)}章`).slice(0, 16), `第${cn(c.n)}章`]);
    links = main.slice(1).map((_, i) => [i, i + 1, '']);
    groups = st.bridges.map(b => [b.from - 1, b.to - 1, b]);
  }
  const GY = 100, GAP = 28;
  const Y = i => i * GY + GAP * groups.filter(([a, b]) => a > 0 && a <= i).length + GAP * groups.filter(([a, b]) => b < i).length;
  const nodes = main.map(([t, sub], i) => ({id:'m' + i, type:'event', text:t, sub, x:0, y:Y(i), tone:'qing'}));
  side.forEach(([t, sub, at], i) => nodes.push({id:'s' + i, type:'event', text:t, sub, x:270, y:Y(at) + 20, tone:'zhu'}));
  const edges = links.map(([a, b, l]) => ({id:uid('e'), from:'m' + a, to:'m' + b, label:l, bend:0}));
  if (side.length){
    edges.push({id:uid('e'), from:'m5', to:'s0', label:'于是'}, {id:uid('e'), from:'s0', to:'s1', label:'', bend:0}, {id:uid('e'), from:'s1', to:'s2', label:'', bend:0}, {id:uid('e'), from:'s2', to:'m7', label:'暗中', secret:true});

  }
  groups.forEach(([a, b, br]) => { if (br) nodes.unshift({id:uid('f'), type:'frame', text:`桥段 · ${br.type[0]}`, tone:br.tone, x:-98, y:Y(a) - 46, w:196, h:Y(b) - Y(a) + 100}); });
  return {nodes, edges, strokes:[]};
}

    if ($('.modal-bg')){ $('.modal-bg').remove(); return; }
    if (selBubEl){ closeSelBub(); return; }
    if ($('#capture').classList.contains('on')){ closeCapture(); return; }
    if ($('.drawer.on')){ closeDrawers(); return; }
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && S.scene === 'study'){ e.preventDefault(); ACT['add-chap'](); return; }
  if (editing) return;
  if (S._tri){
    if (e.key === 'Enter' && !popEl){ e.preventDefault(); $('#triage .pl-guess')?.click(); }
    else if (e.key === 'ArrowRight'){ e.preventDefault(); ACT['tri-skip'](); }
    return;
  }
  if (tourI >= 0 && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')){ e.key === 'ArrowRight' ? ACT['tour-next']() : ACT['tour-prev'](); return; }
  if (activeBoard && activeBoard.root.isConnected && activeBoard.root.closest('.scene.on')){
    if ((e.key === 'Delete' || e.key === 'Backspace') && activeBoard.sel){ e.preventDefault(); activeBoard.del(); return; }
    const map = {v:'select', p:'person', e:'event', n:'note', c:'connect', f:'frame', b:'pen'};
    if (!e.ctrlKey && !e.metaKey && !e.altKey && map[e.key.toLowerCase()]) activeBoard.setTool(map[e.key.toLowerCase()]);
  }
});
window.addEventListener('resize', () => { closePop(); closeSelBub(); });

/* ═════════════════ 启动 ═════════════════ */
renderProto();
go('desk');
</script>
</body>
</html>
